name: manuel_mobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1 # Or the latest version

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  assets:
    - assets/
    - assets/images/
    # Fix: declared so assets/icons/BE_logo.jpg (splash/sign-in logo) loads —
    # Flutter only bundles files directly listed or in a declared subfolder.
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
  uses-material-design: true
